spring:
  application:
    name: nexus-9
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${NEXUS_DB_USER:nexus}
    password: ${NEXUS_DB_PASSWORD:nexus}
    hikari:
      maximum-pool-size: ${NEXUS_DB_POOL_SIZE:10}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring.mvc.problemdetails.enabled: true
