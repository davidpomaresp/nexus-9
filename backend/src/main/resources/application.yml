spring:
  application:
    name: nexus-9
  datasource:
    url: ${NEXUS_DB_URL:jdbc:postgresql://localhost:5432/nexus}
    username: ${NEXUS_DB_USER:nexus}
    password: ${NEXUS_DB_PASSWORD:nexus}

management:
  endpoints:
    web:
      exposure:
        include: health,info

spring.mvc.problemdetails.enabled: true
