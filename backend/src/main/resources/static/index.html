<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS-9</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@600&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>NEXUS-9</h1>
    <div class="meta" id="meta">Sin simulación</div>
  </header>

  <section class="console">
    <form class="setup" id="setup">
      <label>Escenario <select id="scenario"></select></label>
      <label>Semilla <input id="seed" type="number" value="42" step="1"></label>
      <div class="controls"><button type="submit">Nueva simulación</button></div>
    </form>
    <div class="controls">
      <button id="run" type="button" disabled>▶ Ejecutar</button>
      <button id="step" type="button" class="secondary" disabled>+10 ticks</button>
      <button id="jump" type="button" class="secondary" disabled>+100 ticks</button>
      <span class="clock" id="clock"></span>
    </div>
    <p class="error" id="error" hidden></p>
    <div class="cards" id="cards"><p class="empty">Crea una simulación para empezar.</p></div>
  </section>

  <section class="console">
    <h2>Telemetría</h2>
    <div class="charts" id="charts"></div>
    <p class="note">Franjas oscuras: sombra de la órbita. Líneas verticales discontinuas: apertura de incidencias.</p>
  </section>

  <section class="console">
    <h2>Incidencias</h2>
    <div class="tablebox">
      <table class="log">
        <thead><tr><th>Abierta</th><th>Regla</th><th>Módulo</th><th>Prioridad</th><th>Estado</th><th>Afecta a</th></tr></thead>
        <tbody id="log"></tbody>
      </table>
    </div>
  </section>
</div>
<script src="app.js"></script>
</body>
</html>
