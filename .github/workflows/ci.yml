name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Compila, ejecuta los tests unitarios y los de integración (Testcontainers usa el Docker del runner).
      - name: Build y tests
        run: ./mvnw -B verify

      - name: Construir imagen Docker
        run: docker build -t nexus-9:ci .
