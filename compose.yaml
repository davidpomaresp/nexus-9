services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      NEXUS_DB_URL: jdbc:postgresql://postgres:5432/nexus
      NEXUS_DB_USER: nexus
      NEXUS_DB_PASSWORD: nexus
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
